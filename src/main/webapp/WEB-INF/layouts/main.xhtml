<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html lang="#{lenguajeController.locale}">
<f:view xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
        locale="#{lenguajeController.locale}">
<h:head>
    <meta charset="UTF-8"/>
    <h:outputStylesheet name="css/bootstrap.min.css" />
    <h:outputStylesheet name="css/bootstrap.min.js" />

    <ui:insert name="head"/>

    <title>#{titulo}</title>
</h:head>
<h:body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <h:link outcome="index" value="#{msg['navbar.texto.inicio']}" class="nav-link active" />
                    </li>
                    <li class="nav-item">
                        <h:link outcome="form" value="#{msg['navbar.texto.crear']}" class="nav-link" />
                    </li>

                    <li class="nav-item">
                        <h:form>
                            <h:selectOneMenu value="#{lenguajeController.lenguaje}" valueChangeListener="#{lenguajeController.seleccionar}"
                            onchange="submit()" class="form-select">
                                <f:selectItem itemLabel="#{msg['navbar.texto.cambiar.lenguaje']}" itemValue="es" />
                                <f:selectItems value="#{lenguajeController.lenguajesSoportados}" />

                            </h:selectOneMenu>
                        </h:form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <h:messages globalOnly="true" styleClass="alert" errorClass="alert alert-danger" infoClass="alert alert-success" warnClass="alert alert-warning" />
    <div class="container">
        <ui:insert name="content" />
    </div>
    <hr/>
    <footer style="clear: both;">
        <h:graphicImage value="/resources/img/pok.png" alt="logo pokemon" width="100" height="50"/>
        <p> <h:outputText value="#{msg['footer.texto.autor']}" /></p>
        <h:outputScript name="bootstrap.bundle.min.js" />

    </footer>

    <ui:insert name="js"/>

</h:body>
</f:view>
</html>
